name: AI investors daily

on:
  schedule:
    # 매일 22:30 UTC (07:30 KST). 미국장 마감(05:00~06:00 KST)과 한국장 마감 이후.
    # EDGAR 전 종목을 받는 데 8분쯤 걸려 Vercel 함수 시간 한도를 넘으므로, 여기서 스크립트를 직접 돌린다.
    - cron: "30 22 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 지갑 추적 트레이더(제프리황 등) 포지션 기록. 실패해도 AI 계산은 돌게 한다.
      - name: Run wallet traders
        run: node scripts/wallet-traders/index.ts
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Run AI investors
        run: node scripts/ai-investors/index.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          # AI 호반꿀 1분봉을 우리 사이트(/api/bybit-kline)를 거쳐 받는다
          SITE_URL: https://hobanhoney.win
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
